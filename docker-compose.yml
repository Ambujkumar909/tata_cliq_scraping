services:
  redis:
    image: redis:7-alpine
    container_name: pricelens-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: pricelens-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # Every tunable is read from ./.env with the documented default as fallback.
    # Hardcoding them here would silently ignore .env — the file the README
    # tells you to edit — which is how STRICT_SKU used to have no effect.
    environment:
      NODE_ENV: production
      PORT: 4010
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Fetching / scraping tuning (pure HTTP — no headless browser)
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-20000}
      SCRAPE_PROXY: ${SCRAPE_PROXY:-}
      PROXY_HOSTS: ${PROXY_HOSTS:-ajio.com}
      # Matching
      MATCH_MIN_SCORE: ${MATCH_MIN_SCORE:-0.58}
      STRICT_SKU: ${STRICT_SKU:-true}
      INGEST_TARGET_COUNT: ${INGEST_TARGET_COUNT:-2000}
      # Saved comparisons are replayed for this long before re-scraping.
      REPORT_TTL_HOURS: ${REPORT_TTL_HOURS:-168}
      # Link-sourced products stay pinned above the catalog for this long.
      RECENT_TTL_HOURS: ${RECENT_TTL_HOURS:-48}
      RECENT_LIMIT: ${RECENT_LIMIT:-12}
      # Bulk import of a sheet of links.
      IMPORT_CONCURRENCY: ${IMPORT_CONCURRENCY:-4}
      IMPORT_MAX_ROWS: ${IMPORT_MAX_ROWS:-20000}
      IMPORT_MAX_UPLOAD_MB: ${IMPORT_MAX_UPLOAD_MB:-25}
      IMPORT_JOB_TTL_HOURS: ${IMPORT_JOB_TTL_HOURS:-720}
      CACHE_DIR: /app/cache
    ports:
      - "4010:4010"
    volumes:
      # Holds the on-disk comparison snapshot (the fallback used when Redis is
      # unreachable) across image rebuilds. Deliberately NOT /app/data: a volume
      # mounted there would shadow the baked-in catalog and pin it to whatever
      # the first run copied in.
      - api-cache:/app/cache
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4010/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:4010/api
    container_name: pricelens-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Server-side calls from Next to the API (inside the compose network)
      API_INTERNAL_BASE: http://api:4010/api
      # Client-side calls from the browser
      NEXT_PUBLIC_API_BASE: http://localhost:4010/api
    ports:
      - "3000:3000"

volumes:
  redis-data:
  api-cache:
